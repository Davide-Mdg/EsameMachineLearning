# Ambiente Conda portabile per esameML.ipynb (Linux x86_64).
# Pacchetti ricavati dagli import effettivamente utilizzati nel notebook.
# Le versioni seguono quelle dell'ambiente originale, senza build Windows.
name: mlenv
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - numpy=2.0.1
  - pandas=2.3.3
  - matplotlib=3.10.8
  - scikit-learn=1.7.1
  - jupyterlab=4.5
  - ipykernel
  - pip
  - pip:
      - kagglehub==1.0.2
